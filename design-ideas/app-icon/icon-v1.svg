<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08090C"/>
      <stop offset="1" stop-color="#1A1210"/>
    </linearGradient>
    <clipPath id="above"><rect x="0" y="0" width="1024" height="600"/></clipPath>
  </defs>
  <!-- sky above the horizon, sea below -->
  <rect width="1024" height="1024" fill="#08090C"/>
  <rect width="1024" height="600" fill="url(#sky)"/>
  <!-- the sun, half risen -->
  <circle cx="512" cy="600" r="232" fill="#EB4F28" clip-path="url(#above)"/>
  <!-- the horizon -->
  <rect x="0" y="594" width="1024" height="12" fill="#F4F2EE"/>
  <!-- its light on the water: three shorter lines -->
  <rect x="352" y="684" width="320" height="12" rx="6" fill="#EB4F28"/>
  <rect x="412" y="762" width="200" height="12" rx="6" fill="#EB4F28" opacity="0.7"/>
  <rect x="462" y="840" width="100" height="12" rx="6" fill="#EB4F28" opacity="0.4"/>
</svg>
