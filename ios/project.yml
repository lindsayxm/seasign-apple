name: Seasign

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# Bundle ID and team ID come from the one identity file at the repository root.
configFiles:
  Debug: ../app-identity.xcconfig
  Release: ../app-identity.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  swift-openapi-generator:
    url: https://github.com/apple/swift-openapi-generator
    from: 1.14.4
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.13.4
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.4.0

targets:
  Seasign:
    type: application
    platform: iOS
    sources:
      - path: Seasign
      # The contract. The generator plugin reads both files and writes the Swift
      # client into the build folder on every build; nothing generated is committed.
      - path: ../openapi/openapi.json
        group: OpenAPI
        buildPhase: sources
      - path: ../openapi/openapi-generator-config.yaml
        group: OpenAPI
        buildPhase: sources
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: swift-openapi-generator
    # Bundled fonts (OFL; licence files sit next to them in Seasign/Resources/Fonts).
    # XcodeGen writes Seasign/Info.plist from these properties; Xcode merges the
    # INFOPLIST_KEY_* settings below into it at build time.
    info:
      path: Seasign/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Jost-400-Book.ttf
          - Jost-500-Medium.ttf
          - PTSansNarrow-Bold.ttf
        # Google sign-in (task 154): the client ID, set once below as
        # GOOGLE_CLIENT_ID, and the redirect scheme Google gives an iOS
        # client, its reverse DNS form. GoogleOAuthConfig reads the first and
        # derives the second; a test checks the two agree.
        GoogleClientID: $(GOOGLE_CLIENT_ID).apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLName: google-sign-in
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - com.googleusercontent.apps.$(GOOGLE_CLIENT_ID)
    dependencies:
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        # The user's Google OAuth client for this bundle ID (iOS type), without
        # ".apps.googleusercontent.com". Not a secret. The one place it is set.
        GOOGLE_CLIENT_ID: 347928684020-vs0cht1ik72su6d4fl4skogak6odtl82
        # iPhone only. It has to be set on the target: XcodeGen's iOS target
        # preset sets "1,2", which wins over the project-level value above.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Seasign
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - SeasignTests

  SeasignTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SeasignTests
    dependencies:
      - target: Seasign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
